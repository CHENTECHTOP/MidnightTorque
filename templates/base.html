<!DOCTYPE html>
<html lang="uk" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Midnight Torque</title>

    <!-- Bootstrap 5.3 Dark Mode -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f0f1a;
        }

        .navbar {
            background-color: #121226 !important;
        }

        .card {
            background-color: #1a1a2e !important;
            border-radius: 15px;
        }

        .btn-gradient {
            background: linear-gradient(45deg, #4e73df, #1cc88a);
            border: none;
            color: white;
        }

        .btn-gradient:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold text-light" href="/">CHENTECHTOP</a>

        <div>
            {% if current_user.is_authenticated %}

                <a class="btn btn-warning me-2"
                   href="https://send.monobank.ua/jar/7AC4Vaid8z"
                   target="_blank">
                   💛 Підтримати автора
                </a>

                <a class="btn btn-outline-light me-2" href="/profile">
                    👤 Профіль
                </a>

                <a class="btn btn-danger" href="/logout">
                    🚪 Вийти
                </a>

            {% else %}

                <a class="btn btn-outline-light me-2" href="/login">
                    Логін
                </a>

                <a class="btn btn-success" href="/register">
                    Реєстрація
                </a>

            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-5">

{% with messages = get_flashed_messages() %}
    {% for msg in messages %}
        <div class="alert alert-warning">{{ msg }}</div>
    {% endfor %}
{% endwith %}

{% block content %}{% endblock %}

</div>

</body>
</html>
